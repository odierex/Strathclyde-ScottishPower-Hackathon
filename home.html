<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game home base</title>
    <style>
        :root {
          --ink: #14213d;
          --paper: #f7f8fa;
          --panel: #ffffff;
          --line: #c9d0dc;
          --signal: #ffc400;
          --teal: #0b7a75;
          font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
          color: var(--ink);
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); line-height: 1.5; }

        /* Header */
        .top {
          background: var(--ink);
          color: #fff;
          padding: 1rem 1.5rem;
          border-bottom: 6px solid var(--signal);
        }
        .top h1 { margin: 0; font-size: 1.6rem; }
        .top p { margin: 0.2rem 0 0; color: #cfd6e4; }

        /* Layout: side nav + main */
        .layout { display: flex; min-height: calc(100vh - 100px); }
        .side {
          width: 220px;
          background: var(--panel);
          border-right: 1px solid var(--line);
          padding: 1.25rem 1rem;
        }
        .side a {
          display: block;
          padding: 0.6rem 0.8rem;
          margin-bottom: 0.25rem;
          border-radius: 6px;
          color: var(--ink);
          text-decoration: none;
        }
        .side a:hover { background: #eef1f6; }
        .side a[aria-current="page"] {
          background: var(--ink);
          color: #fff;
          font-weight: 600;
        }

        main { flex: 1; padding: 2rem 1.5rem; max-width: 760px; }

        .hero {
          width: 100%;
          max-height: 240px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: var(--panel);
          object-fit: contain;
          margin-bottom: 1.5rem;
        }

        h2 { font-size: 1.5rem; margin: 0 0 1.25rem; max-width: 60ch; }

        .answers { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; }
        .answers button {
          font: inherit;
          text-align: left;
          padding: 1rem 1.1rem;
          background: var(--panel);
          color: var(--ink);
          border: 2px solid var(--ink);
          border-radius: 8px;
          cursor: pointer;
        }
        .answers button:hover { background: #fff6cc; }
        .answers button:focus-visible,
        .side a:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
        .answers button[aria-pressed="true"] {
          background: var(--ink);
          color: #fff;
        }

        /* Stack on small screens */
        @media (max-width: 720px) {
          .layout { flex-direction: column; }
          .side { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
          .answers { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header class="top">
    <h1 id="game-name">Game name</h1>
    <p id="business-name">Business name</p>
</header>

<div class="layout">
    <nav class="side" aria-label="Main">
        <a href="index.html" aria-current="page">Home</a>
        <a href="#">Choose controls</a>
        <a href="#">The attack</a>
        <a href="#">Results</a>
    </nav>

    <main>
        <!-- Replace the src with your own image file, e.g. images/hero.png -->
        <img class="hero" alt="A padlock and shield illustration"
             src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 200'%3E%3Crect width='400' height='200' fill='%23eef1f6'/%3E%3Cpath d='M200 30 L260 55 V105 C260 140 232 160 200 172 C168 160 140 140 140 105 V55 Z' fill='%2314213d'/%3E%3Crect x='178' y='95' width='44' height='38' rx='5' fill='%23ffc400'/%3E%3Cpath d='M186 95 V84 a14 14 0 0 1 28 0 V95' fill='none' stroke='%23ffc400' stroke-width='6'/%3E%3C/svg%3E">

        <h2 id="question">Placeholder question: what should you do first?</h2>

        <div class="answers" role="group" aria-labelledby="question">
            <button type="button" aria-pressed="false">Answer A</button>
            <button type="button" aria-pressed="false">Answer B</button>
            <button type="button" aria-pressed="false">Answer C</button>
            <button type="button" aria-pressed="false">Answer D</button>
        </div>
    </main>
</div>

<script>
    // Change the names here, in one place only.
    const GAME_NAME = "Your Game Name";
    const BUSINESS_NAME = "Your Fictional Business";

    document.getElementById("game-name").textContent = GAME_NAME;
    document.getElementById("business-name").textContent = BUSINESS_NAME;
    document.title = GAME_NAME;

    // Basic select behaviour: one answer highlighted at a time.
    const buttons = document.querySelectorAll(".answers button");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
      });
    });
</script>
</body>
</html>
